name: Torrent to Google Drive

on:
  workflow_dispatch:
    inputs:
      magnet_link:
        description: 'Magnet link torrent yang mau didownload'
        required: true
        type: string

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install aria2 & rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          curl https://rclone.org/install.sh | sudo bash

      - name: Download torrent via magnet link
        run: |
          mkdir -p downloads
          timeout 5h aria2c \
            --dir=downloads \
            --seed-time=0 \
            --bt-stop-timeout=120 \
            --max-connection-per-server=16 \
            --split=16 \
            --file-allocation=none \
            --summary-interval=30 \
            "${{ github.event.inputs.magnet_link }}"

      - name: Write rclone config
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Upload to Google Drive
        run: |
          rclone copy downloads gdrive: --drive-root-folder-id="${{ secrets.GDRIVE_FOLDER_ID }}" -P

      - name: Cleanup credential
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf
